# AMG Lock App — GitHub Actions se test APK banana (FIXED v2)
#
# YE FILE REPO KI ROOT MEIN HAI, is naam se:
#   .github/workflows/build-apk.yml
# Update karne ke liye: GitHub par file kholein -> pencil (Edit) dabayein
# -> poora text select karke delete karein -> is file ka poora text
# paste karein -> Commit changes dabayein. Build dobara chal pare gi.
#
# Fix (2026-11-13): "Android SDK lagayein" wala step (android-actions/
# setup-android@v3) naye runner par fail ho gaya tha — wo action purana
# hai. Usay hata diya: GitHub ke runner mein Android SDK pehle se hota
# hai, aur -Pandroid.builder.sdkDownload=true se koi kami wali cheez
# (platform/build-tools) build ke waqt khud download ho jati hai.
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code lein
        uses: actions/checkout@v4

      - name: Java 17 lagayein
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: gradle-wrapper.jar lein (agar na ho)
        working-directory: lock-app
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            curl -L -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar
          fi

      - name: gradlew ko ijazat dein
        working-directory: lock-app
        run: chmod +x gradlew

      - name: Test APK banayein
        working-directory: lock-app
        run: ./gradlew assembleDebug -Pandroid.builder.sdkDownload=true

      - name: APK save karein
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: lock-app/app/build/outputs/apk/debug/app-debug.apk
