# AMG Lock App — GitHub Actions se test APK banana
#
# YE FILE REPO KI ROOT MEIN DALNI HAI, is naam se:
#   .github/workflows/build-apk.yml
# (Repo mein: Add file -> Create new file -> naam upar wala likhein,
#  phir is file ka poora text paste karke Commit changes dabayein.)
#
# Wajah: lock-app ka code repo mein "lock-app" folder ke andar hai,
# is liye ye workflow "lock-app" ke andar ja kar build chalata hai.
# Commit karte hi Actions tab mein "Build APK" khud chal pare ga.
# Khatam hone par us run ko kholein, neeche "Artifacts" mein
# "app-debug" mile ga — download karke app-debug.apk nikal lein.
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code lein
        uses: actions/checkout@v4

      - name: Java 17 lagayein
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Android SDK lagayein
        uses: android-actions/setup-android@v3

      - name: gradle-wrapper.jar lein (agar na ho)
        working-directory: lock-app
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            curl -L -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar
          fi

      - name: gradlew ko ijazat dein
        working-directory: lock-app
        run: chmod +x gradlew

      - name: Test APK banayein
        working-directory: lock-app
        run: ./gradlew assembleDebug

      - name: APK save karein
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: lock-app/app/build/outputs/apk/debug/app-debug.apk
